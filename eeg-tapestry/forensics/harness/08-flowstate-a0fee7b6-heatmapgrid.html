<!doctype html><html><head><meta charset=utf-8><title>FlowState a0fee7b6 HeatMapGrid+GridWavelet (40x40 CSS divs, size<=2.5*cell, black bg)</title><style>body{margin:0;font:12px sans-serif;background:#fff} .lbl{position:fixed;left:6px;bottom:4px;background:#fff;padding:2px 4px;z-index:99999;color:#000}</style><script>let __s=20241122;Math.random=()=>{__s|=0;__s=__s+0x6D2B79F5|0;let t=Math.imul(__s^__s>>>15,1|__s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function el(tag,style,parent){const e=document.createElement(tag);Object.assign(e.style,style||{});(parent||document.body).appendChild(e);return e;}
const C8={delta:"#dd0a0a",theta:"#ff8500",lowAlpha:"#fcea01",highAlpha:"#58ed14",lowBeta:"#16caf4",highBeta:"#022aba",lowGamma:"#6f5ba3",highGamma:"#e50cbc"};
</script></head><body><div class=lbl>FlowState a0fee7b6 HeatMapGrid+GridWavelet (40x40 CSS divs, size<=2.5*cell, black bg)</div><script>
function noise2D(x,y){const n=Math.sin(x*12.9898+y*78.233)*43758.5453;return n-Math.floor(n);}
function smoothstep(e0,e1,x){const t=Math.max(0,Math.min(1,(x-e0)/(e1-e0)));return t*t*(3-2*t);}
function genClusters(gs,n){const st=['theta_dominant','alpha_dominant','beta_dominant','gamma_dominant','mixed'];const o=[];for(let i=0;i<n;i++)o.push({x:Math.random()*gs,y:Math.random()*gs,intensity:.7+Math.random()*.3,state:st[Math.floor(Math.random()*5)]});return o;}
function infl(x,y,cl,r){let tot=0;const sc={theta_dominant:0,alpha_dominant:0,beta_dominant:0,gamma_dominant:0,mixed:0};cl.forEach(c=>{const d=Math.hypot(x-c.x,y-c.y);if(d<r){const f=smoothstep(r,0,d)*c.intensity;tot+=f;sc[c.state]+=f;}});
let ds='mixed',m=0;for(const k in sc)if(sc[k]>m){m=sc[k];ds=k;}return{intensity:Math.min(1,tot),state:ds};}
const P={theta_dominant:[[.6,.4],[.8,.2],[.2,.3],[.1,.2],[.1,.1],[.05,.1],[.05,.1],[.05,.1]],alpha_dominant:[[.2,.3],[.3,.3],[.7,.3],[.8,.2],[.3,.2],[.2,.2],[.1,.1],[.1,.1]],
beta_dominant:[[.1,.2],[.1,.2],[.2,.3],[.3,.3],[.7,.3],[.8,.2],[.4,.3],[.3,.2]],gamma_dominant:[[.05,.1],[.1,.1],[.2,.2],[.3,.2],[.4,.3],[.5,.3],[.7,.3],[.8,.2]],mixed:[[.3,.4],[.4,.4],[.4,.4],[.4,.4],[.4,.4],[.4,.4],[.3,.4],[.3,.4]]};
const K=['delta','theta','lowAlpha','highAlpha','lowBeta','highBeta','lowGamma','highGamma'];
function genPoint(x,y,cl,cfg){const {intensity,state}=infl(x,y,cl,cfg.clusterRadius);const n=noise2D(x*.1,y*.1);const fi=Math.max(0,Math.min(1,intensity+(n-.5)*cfg.noiseStrength));
const o={};K.forEach((k,i)=>{const [a,b]=P[state][i];o[k]=(a+Math.random()*b)*fi;});return o;}

const gs=40,cl=genClusters(gs,8),cfg={clusterRadius:15,noiseStrength:.2};const cell=Math.max(12,Math.min(30,800/gs));
const wrap=el('div',{position:'relative',width:gs*cell+'px',height:gs*cell+'px',background:'#000',margin:'20px'});
const grid=el('div',{position:'absolute',inset:'0',display:'grid',gridTemplateColumns:`repeat(${gs},${cell}px)`,gridTemplateRows:`repeat(${gs},${cell}px)`,mixBlendMode:'screen'},wrap);
const layers=['highGamma','lowGamma','highBeta','lowBeta','highAlpha','lowAlpha','theta','delta'];
for(let y=0;y<gs;y++)for(let x=0;x<gs;x++){const d=genPoint(x,y,cl,cfg);const tp=K.reduce((a,k)=>a+d[k],0);const size0=8+(tp/8)*72;
const dc=Math.hypot(x-gs/2,y-gs/2),md=Math.hypot(gs/2,gs/2);const vo=.4+(1-dc/md)*.6;const ti=tp/8;const fo=vo*(.5+ti*.5);const size=Math.min(size0,cell*2.5);
const c=el('div',{position:'relative',width:cell+'px',height:cell+'px',overflow:'visible'},grid);
const w=el('div',{position:'absolute',width:size+'px',height:size+'px',left:'50%',top:'50%',transform:'translate(-50%,-50%)'},c);
layers.forEach((k,idx)=>{const b=size*.95,mn=b*.08,mx=b*(1-idx*.11);const ls=mn+d[k]*(mx-mn);
el('div',{position:'absolute',borderRadius:'50%',background:C8[k],width:ls+'px',height:ls+'px',left:'50%',top:'50%',transform:'translate(-50%,-50%)',opacity:fo*(.7+d[k]*.3)},w);});}
</script></body></html>
